<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboHero Controller</title>
<style>
:root {
  --bg-primary: #0f172a;
  --bg-card: rgba(30, 41, 59, 0.75);
  --bg-card-hover: rgba(51, 65, 85, 0.85);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent-cyan: #06b6d4;
  --accent-blue: #3b82f6;
  --accent-pink: #ec4899;
  --accent-green: #10b981;
  --accent-amber: #f59e0b;
  --border: rgba(255, 255, 255, 0.1);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Oxygen, Ubuntu, Cantarell, sans-serif;
  min-height: 100vh;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.navbar {
  width: 100%;
  max-width: 600px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.brand {
  font-size: 1.25rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-link {
  color: var(--text-main);
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.2),
    rgba(59, 130, 246, 0.2));
  border: 1px solid var(--accent-cyan);
  padding: 8px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  transition: all 0.2s ease;
}
.nav-link:hover {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  color: #fff;
  box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
}
.container {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.card-title {
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 12px;
  font-weight: 600;
}
.dpad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 14px 10px;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  user-select: none;
}
.btn:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255, 255, 255, 0.2);
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border: none;
}
.btn-primary:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); }
.btn-standby {
  background: linear-gradient(135deg, #db2777, #be185d);
  border: none;
  font-weight: 700;
}
.btn-standby:hover { background: linear-gradient(135deg, #ec4899, #db2777); }
.btn-relax {
  background: linear-gradient(135deg, #475569, #334155);
  border: none;
  font-weight: 700;
}
.btn-relax:hover { background: linear-gradient(135deg, #64748b, #475569); }
.btn-action {
  background:
    linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.2));
  border-color: var(--accent-amber);
  color: #fde68a;
}
.btn-action:hover {
  background: linear-gradient(135deg, var(--accent-amber), #d97706);
  color: #000;
}
.btn-auto {
  background: linear-gradient(135deg, #059669, #047857);
  border: none;
  font-weight: 700;
  grid-column: span 2;
}
.btn-auto:hover { background: linear-gradient(135deg, #10b981, #059669); }
.btn-stop {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  border: none;
  font-weight: 700;
  grid-column: span 2;
}
.btn-stop:hover { background: linear-gradient(135deg, #ef4444, #dc2626); }
.actions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.toast {
  position: fixed;
  bottom: 20px;
  background: rgba(16, 185, 129, 0.9);
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="navbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </svg>
    RoboHero
  </div>
  <a href="/calibrate" class="nav-link" id="nav-calibrate">PWM Calibration</a>
</div>
<div class="container">
  <div class="card">
    <div class="card-title">Locomotion</div>
    <div class="dpad-grid">
      <button class="btn btn-primary" id="btn-turn-left"
              onclick="sendCmd('pm', 3)">Turn Left</button>
      <button class="btn btn-primary" id="btn-forward"
              onclick="sendCmd('pm', 1)">Forward</button>
      <button class="btn btn-primary" id="btn-turn-right"
              onclick="sendCmd('pm', 4)">Turn Right</button>
      <button class="btn btn-primary" id="btn-move-left"
              onclick="sendCmd('pm', 5)">Move Left</button>
      <button class="btn btn-standby" id="btn-standby"
              onclick="sendCmd('pm', 99)">STANDBY</button>
      <button class="btn btn-primary" id="btn-move-right"
              onclick="sendCmd('pm', 6)">Move Right</button>
      <button class="btn btn-relax" id="btn-relax"
              onclick="sendCmd('relax', 1)">Relax</button>
      <button class="btn btn-primary" id="btn-backward"
              onclick="sendCmd('pm', 2)">Backward</button>
      <div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Recovery</div>
    <div class="actions-grid">
      <button class="btn btn-primary" id="btn-get-up"
              onclick="sendCmd('pm', 11)">Get Up</button>
      <button class="btn btn-primary" id="btn-get-up-face"
              onclick="sendCmd('pm', 12)">Face-Down Get Up</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Actions & Gestures</div>
    <div class="actions-grid">
      <button class="btn btn-action" id="btn-bow"
              onclick="sendCmd('pms', 1)">Bow</button>
      <button class="btn btn-action" id="btn-apache"
              onclick="sendCmd('pms', 4)">Apache</button>
      <button class="btn btn-action" id="btn-waving"
              onclick="sendCmd('pms', 2)">Waving</button>
      <button class="btn btn-action" id="btn-balance"
              onclick="sendCmd('pms', 5)">Balance</button>
      <button class="btn btn-action" id="btn-ironman"
              onclick="sendCmd('pms', 3)">Iron Man</button>
      <button class="btn btn-action" id="btn-warmup"
              onclick="sendCmd('pms', 6)">Warm-Up</button>
      <button class="btn btn-action" id="btn-clap"
              onclick="sendCmd('pms', 7)">Clap Hands</button>
      <button class="btn btn-action" id="btn-goilc"
              onclick="sendCmd('pms', 8)">GOILC</button>
      <button class="btn btn-action" id="btn-dance"
              onclick="sendCmd('pms', 9)">Dance</button>
      <button class="btn btn-auto" id="btn-auto"
              onclick="sendCmd('pms', 99)">Auto Demo Loop</button>
      <button class="btn btn-stop" id="btn-stop"
              onclick="sendCmd('stop', 1)">STOP</button>
    </div>
  </div>
</div>
<div id="toast" class="toast">Command sent</div>
<script>
function sendCmd(key, val) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/?' + key + '=' + val + '&_t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var j = JSON.parse(xhr.responseText);
          if (j.stopped === true) {
            showToast('Stopped');
          } else {
            showToast('Command sent');
          }
        } catch (e) {
          showToast('Command sent');
        }
      } else if (xhr.status === 503) {
        try {
          var err = JSON.parse(xhr.responseText);
          showToast(err.status === 'voltage_low' ? 'Voltage low'
            : 'Command sent');
        } catch (e) {
          showToast('Command sent');
        }
      } else {
        showToast('Command sent');
      }
    }
  };
  xhr.send();
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1500);
}
</script>
</body>
</html>
